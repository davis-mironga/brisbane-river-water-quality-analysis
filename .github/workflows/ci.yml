name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Validate project structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -d notebooks
          test -d sql
          test -d src
          test -f src/cleaning.py
          test -f src/analysis.py
          echo "Project structure OK"

      - name: Check for accidentally committed data files
        run: |
          if [ -f data/raw/brisbane_water_quality.csv ]; then
            echo "ERROR: raw data file is committed to git"
            exit 1
          fi
          if [ -f data/processed/water_quality_cleaned.csv ]; then
            echo "ERROR: processed data file is committed to git"
            exit 1
          fi
          echo "No data files accidentally committed"
